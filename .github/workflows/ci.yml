name: "Terraform CI"

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  terraform-validate:
    name: "Validation Terraform"
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Configurer les identifiants AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Installer Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Initialiser Terraform
        run: terraform init

      - name: Valider la syntaxe
        run: terraform validate

      - name: Planifier les modifications
        run: terraform plan
        
      - name: Connexion et déploiement via SSH sur l'instance
        uses: appleboy/ssh-action@master
        with:
            host: ${{ secrets.INSTANCE_ADRESS }}
            username: ubuntu
            key: ${{ secrets.INSTANCE_SECRET_KEY }}
            script: |
             cd
             cd terraform-practice
             git pull origin main
